<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0}
.s{width:320px;height:220px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%,#3B2C4A 0%,#1E1A2B 60%,#15131E 100%)}
.lamp{position:absolute;left:150px;top:-30px;width:20px;height:60px;background:#2a2536}
.glow{position:absolute;left:60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,61,.35),rgba(255,200,61,0) 65%)}
.table{position:absolute;left:-20px;right:-20px;bottom:-30px;height:90px;border-radius:50%;background:linear-gradient(180deg,#5A3B3F,#3A2630)}
.p{position:absolute;bottom:20px;width:62px;height:112px;border-radius:12px;background:#0E0D1F;box-shadow:0 0 0 3px #2E2A44,0 14px 22px -8px rgba(0,0,0,.7)}
.p i{position:absolute;inset:7px 6px 12px;border-radius:7px;background:linear-gradient(160deg,#FF9AD5,#8C86A3 70%,#5E5674)}
.p b{position:absolute;right:-10px;top:-10px;width:24px;height:24px;border-radius:50%;background:#FF5C8A;color:#fff;font:800 13px/24px Arial;text-align:center;box-shadow:0 0 0 3px #1E1A2B}
.h{position:absolute;bottom:-6px;width:58px;height:46px;border-radius:24px 24px 10px 10px;background:#E9A58F}
.cup{position:absolute;bottom:34px;width:22px;height:20px;border-radius:0 0 8px 8px;background:#F6F2F4}
.cup:after{content:'';position:absolute;right:-7px;top:4px;width:7px;height:8px;border:2px solid #F6F2F4;border-left:0;border-radius:0 6px 6px 0}
.dots{position:absolute;font:700 18px Arial;color:#FFC83D;letter-spacing:3px}
</style></head><body><div class=s>
<div class=glow></div><div class=table></div>
<div class=cup style="left:150px"></div>
<div class=p style="left:30px;transform:rotate(-14deg)"><i></i><b>3</b></div><div class=h style="left:32px;transform:rotate(-14deg)"></div>
<div class=p style="left:129px;bottom:46px"><i style="background:linear-gradient(160deg,#FFC83D,#F08A6C 70%,#5E5674)"></i><b>9</b></div><div class=h style="left:131px;bottom:18px"></div>
<div class=p style="left:228px;transform:rotate(13deg)"><i style="background:linear-gradient(160deg,#C6F36B,#8C86A3 70%,#5E5674)"></i><b>!</b></div><div class=h style="left:230px;transform:rotate(13deg)"></div>
<div class=dots style="left:88px;top:28px">· · ·</div><div class=dots style="left:200px;top:40px">· · ·</div>
</div></body></html>
