# Автозбірка Vespr на GitHub: тести → веб-версія на GitHub Pages + APK для Android.
# Запускається сама після кожної зміни в main, або вручну: Actions → build → Run workflow.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=web --project-name vespr
      - run: python3 tool/web_tweaks.py
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - run: python3 tool/web_cachebust.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup.sh
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vespr-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
