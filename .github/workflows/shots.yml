# Знімки й перевірка верстки Wrapped: рендерить кожен слайд у трьох варіантах
# і кладе PNG + звіт у гілку shots. Деплой не блокує.
name: shots

on:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'test/**', '.github/workflows/shots.yml']
  workflow_dispatch:
    inputs:
      scale:
        description: 'Масштаб знімків (1 — звичайні в гілку shots, 2–3 — чіткі для сайту в гілку shots-hd)'
        default: '1'

permissions:
  contents: write

concurrency:
  group: shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Рендер слайдів
        run: SHOT_SCALE=${{ inputs.scale || '1' }} LAYOUT=1 SHOTS=1 flutter test test/wrapped_layout_test.dart test/screens_layout_test.dart > layout.txt 2>&1 || true
      - name: Гілка shots
        run: |
          mkdir -p out && cp -r build/shots out/ 2>/dev/null || true
          cp layout.txt out/
          cp build/en_missing.txt out/ 2>/dev/null || true
          cp build/en_missing_wrapped.txt out/ 2>/dev/null || true
          cd out
          git init -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "shots ${GITHUB_SHA::7}"
          BR=shots; [ "${{ inputs.scale || '1' }}" != "1" ] && BR=shots-hd
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:$BR
