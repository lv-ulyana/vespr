name: vespr
description: Приватний щоденник побачень. Дані тільки на телефоні.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  cryptography: ^2.7.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  file_selector: ^1.0.3
  add_2_calendar: ^3.0.1
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  web: ^1.1.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/ach/
    - assets/wrapped/
  fonts:
    - family: Zodiac
      fonts:
        - asset: assets/fonts/NotoZodiac.ttf
    - family: Prata
      fonts:
        - asset: assets/fonts/Prata_400Regular.ttf
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway_400Regular.ttf
        - asset: assets/fonts/Raleway_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway_700Bold.ttf
          weight: 700
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest_800ExtraBold.ttf
          weight: 800
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono_600SemiBold.ttf
          weight: 600
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond_500Medium_Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CormorantGaramond_500Medium.ttf
          weight: 500
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald_600SemiBold.ttf
          weight: 600
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat_300Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat_500Medium.ttf
          weight: 500
